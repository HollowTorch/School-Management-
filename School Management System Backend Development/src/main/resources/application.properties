spring.application.name=school-management-system
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/school_management_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:change_me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_BYTES}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}
app.sms.provider=${SMS_PROVIDER:mock}
app.sms.arkesel.api-key=${ARKESEL_API_KEY:}
app.sms.arkesel.sender-id=${ARKESEL_SENDER_ID:SchoolAlert}
app.sms.arkesel.base-url=${ARKESEL_BASE_URL:https://sms.arkesel.com/api/v2/sms/send}
