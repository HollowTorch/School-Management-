services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: school_management_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - school_pgdata:/var/lib/postgresql/data
  backend:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/school_management_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: local_dev_password
      JWT_SECRET: change-this-to-a-random-secret-at-least-32-bytes-long
      SMS_PROVIDER: mock
    ports:
      - "8080:8080"
volumes:
  school_pgdata:
